<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farborn Studios – Mobile Games</title>
<meta name="description" content="Farborn Studios is an independent game studio from South Africa. Home of Nova Rings: Idle Ring Breaker.">
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0820;color:#eef;line-height:1.6}
  main{max-width:760px;margin:0 auto;padding:48px 20px}
  h1{font-size:2.4rem;margin:0 0 4px;background:linear-gradient(90deg,#ff4fd8,#5ad1ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{color:#aab;margin:0 0 40px}
  .card{background:#171236;border:1px solid #2c2560;border-radius:16px;padding:24px;margin-bottom:24px}
  h2{margin-top:0}
  a{color:#5ad1ff}
  .btn{display:inline-block;margin:8px 12px 0 0;padding:10px 18px;border-radius:999px;background:#ff4fd8;color:#fff;text-decoration:none;font-weight:600}
  .btn.alt{background:#2c2560}
  footer{color:#889;font-size:.9rem;margin-top:40px}
</style>
</head>
<body>
<main>
  <h1>Farborn Studios</h1>
  <p class="tag">Independent mobile games from South Africa.</p>

  <div class="card">
    <h2>Nova Rings: Idle Ring Breaker</h2>
    <p>Smash glowing rings, fire huge boosters and beat a boss every 10 levels. Plays offline, and every ad is your choice – no forced ads.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.farbornstudios.novarings">Google Play</a>
    <a class="btn alt" href="https://www.youtube.com/@farbornstudios">YouTube</a>
    <a class="btn alt" href="https://sites.google.com/view/farbornstudios-novarings">Privacy policy</a>
  </div>

  <footer>© 2026 Farborn Studios</footer>
</main>
</body>
</html>
